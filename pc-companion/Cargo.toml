[package]
name = "pandapointer-pc"
version = "0.1.0"
edition = "2021"
description = "Programme compagnon PandaPointer : reçoit les mouvements du téléphone et pilote la souris du PC"

[dependencies]

# La vraie souris n'est pilotée que sous Windows et Mac.
# Ailleurs (Linux, par exemple pour les tests), on utilise le mode test sans souris.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
enigo = "0.5"

# Fenêtre transparente du laser : Windows seulement.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
